name: Docs

# Builds the mdBook guide (docs/book) on every change to the docs and publishes it to GitHub Pages
# from master. Pages must be enabled once in the repository settings with source "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    name: build the guide
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build (warnings are errors)
        shell: bash
        run: |
          mdbook build docs/book 2>&1 | tee mdbook.log
          if grep -E 'WARN|ERROR' mdbook.log; then
            echo "::error::mdBook reported warnings"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/book

  deploy:
    name: publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
