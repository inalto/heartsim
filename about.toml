# cargo-about configuration: the licence allow-list mirrors deny.toml so the report and the policy cannot drift.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "BSL-1.0",
    "Ubuntu-font-1.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Report only what ships: dev/build-only crates (insta, criterion, proptest, xtask's resvg) are excluded.
ignore-dev-dependencies = true
ignore-build-dependencies = true
