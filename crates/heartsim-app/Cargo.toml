[package]
name = "heartsim-app"
description = "heartsim desktop application (eframe/egui + wgpu)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "heartsim"

[[bin]]
name = "heartsim"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native", "export", "parallel", "update-check", "online-cases"]
# Desktop only: asset discovery on disk (`$HEARTSIM_ASSETS`, next to the executable), the per-user
# data directory (tutorial progress, saved scenarios), plain-file save/load buttons and the CLI-style
# `--version` entry. The web build (`heartsim-web`) leaves this off and gets its assets from an
# in-memory `AssetBundle` and its settings from eframe's storage (localStorage).
native = ["dep:directories", "dep:tracing-subscriber"]
# Export / Import window (PDF, PNG, CSV, WFDB, bundles): needs files, so it implies `native`.
export = ["native", "dep:heartsim-io"]
# Rayon in the engines; the browser has no threads, so the web build turns it off.
parallel = ["heartsim-sim/parallel", "heartsim-ecg/parallel", "heartsim-render/parallel"]
# QRS-synchronous monitor beep and the heart sounds (B25; both off by default in Settings): a short tone synthesised in code
# on each ventricular activation, and the phonocardiogram streamed through a custom `kira` sound fed by an `rtrb` queue. Native desktop only; on Linux it needs the ALSA headers (`libasound2-dev`) to build, so it
# is not in `default` and the release workflow switches it on. The web build never enables it. Without the feature the
# `monitor_beep` module still compiles (pure logic, no audio device is ever opened).
audio = ["native", "dep:kira", "dep:rtrb"]
# One GET of the GitHub releases API at start (switchable off in Settings) and a notice when a newer release exists; on the
# user's request the dialog downloads this platform's installer, checks its SHA-256 and starts it. Desktop only: the browser
# build has no thread to spawn and no installer.
update-check = ["native", "dep:ureq", "dep:semver", "dep:serde_json", "dep:sha2"]
# Online case libraries (B43): the Cases page's "Browse the online library" and "Import" make one HTTPS GET each with
# `ureq` on a thread, only when clicked. Desktop only and independent of `update-check`; the browser build injects its own
# `fetch` transport from `heartsim-web` instead. The SHA-256 of a download is checked with `heartsim-casefile`.
online-cases = ["native", "dep:ureq"]

[build-dependencies]
embed-resource.workspace = true

[dependencies]
heartsim-core.workspace = true
heartsim-geometry.workspace = true
heartsim-sim.workspace = true
heartsim-ecg.workspace = true
heartsim-echo.workspace = true
heartsim-render.workspace = true
heartsim-ui.workspace = true
heartsim-calc.workspace = true
heartsim-casefile.workspace = true
heartsim-io = { workspace = true, optional = true }
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
glam.workspace = true
image.workspace = true
anyhow.workspace = true
serde.workspace = true
ron.workspace = true
directories = { workspace = true, optional = true }
egui_commonmark.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
kira = { workspace = true, optional = true }
rtrb = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# Case files (B41): open / save dialogs on both targets, My cases in browser storage as base64.
rfd.workspace = true
base64.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# drives rfd's async dialogs on a short-lived thread (case files, B41)
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `std::time::Instant` is unavailable in the browser: the re-entry frame budget reads `Date.now()`.
js-sys.workspace = true
# rfd's dialogs and dropped files are read asynchronously in the browser (case files, B41)
wasm-bindgen-futures.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
# the checksums of the reference recordings are verified in tests
sha2.workspace = true
# egui's bundled fonts, so headless kittest harnesses can lay out text
egui = { workspace = true, features = ["default_fonts"] }

[lints]
workspace = true
