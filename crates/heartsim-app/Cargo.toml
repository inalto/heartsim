[package]
name = "heartsim-app"
description = "heartsim desktop application (eframe/egui + wgpu)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "heartsim"

[[bin]]
name = "heartsim"
path = "src/main.rs"

[dependencies]
heartsim-core.workspace = true
heartsim-geometry.workspace = true
heartsim-sim.workspace = true
heartsim-ecg.workspace = true
heartsim-render.workspace = true
heartsim-ui.workspace = true
heartsim-io.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
glam.workspace = true
image.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
# egui's bundled fonts, so headless kittest harnesses can lay out text
egui = { workspace = true, features = ["default_fonts"] }

[lints]
workspace = true
