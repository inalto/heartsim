[package]
name = "heartsim-render"
description = "wgpu rendering for heartsim: offscreen 3-D scene (heart, torso, electrodes) with per-vertex scalar colouring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
heartsim-core.workspace = true
heartsim-geometry.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
image.workspace = true
rayon = { workspace = true, optional = true }

[features]
default = ["parallel"]
# Per-vertex scalar mapping on rayon; the web build turns it off (no threads in the browser).
parallel = ["dep:rayon"]

[dev-dependencies]
pollster.workspace = true

[lints]
workspace = true
