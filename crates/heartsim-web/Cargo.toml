[package]
name = "heartsim-web"
description = "heartsim in the browser: the eframe app on WebGPU / WebGL2, built with trunk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Nothing to publish: the product of this crate is the `trunk build` output (dist/).
publish = false

[[bin]]
name = "heartsim-web"
path = "src/main.rs"

[dependencies]
# No `native` (disk, user directories), no `export` (PDF and files), no `parallel` (no threads in a page).
heartsim-app = { workspace = true }
zip = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
log.workspace = true
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
    "Response", "console",
] }

[lints]
workspace = true
