<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="heartsim: a 3-D heart electrophysiology and 12-lead ECG simulator for medical education." />
    <title>heartsim — heart and ECG simulator</title>

    <!-- Rust -> wasm (wasm-bindgen + wasm-opt). Relative URLs everywhere (see Trunk.toml): the page works
         from a sub-path such as https://<user>.github.io/heartsim/ and from a plain static server. -->
    <link data-trunk rel="rust" data-bin="heartsim-web" data-wasm-opt="z" data-bindgen-target="web" />
    <!-- anatomy pack + rhythms + tutorials, written by `cargo xtask web-assets` (Trunk.toml pre_build hook) -->
    <link data-trunk rel="copy-file" href="generated/heartsim-assets.zip" />

    <style>
      html, body { margin: 0; height: 100%; background: #1b1b1b; overflow: hidden; }
      canvas#heartsim_canvas { display: block; width: 100vw; height: 100vh; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; color: #e8e8e8; font: 16px/1.4 system-ui, sans-serif; background: #1b1b1b; text-align: center; padding: 0 16px;
      }
      #loading h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: 0.02em; }
      #loading .spinner {
        width: 40px; height: 40px; border-radius: 50%; border: 4px solid #444; border-top-color: #e0524d;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #loading .spinner { animation-duration: 4s; } }
      #loading small { color: #9a9a9a; }
    </style>
  </head>
  <body>
    <canvas id="heartsim_canvas" tabindex="0" aria-label="heartsim simulator"></canvas>
    <div id="loading" role="status" aria-live="polite">
      <h1>heartsim</h1>
      <div class="spinner" aria-hidden="true"></div>
      <div id="loading_text">Loading…</div>
      <small>Educational tool, not for clinical use. Needs a browser with WebGPU or WebGL2.</small>
      <noscript>heartsim needs JavaScript and WebAssembly.</noscript>
    </div>
  </body>
</html>
