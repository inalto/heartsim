[package]
name = "heartsim-ui"
description = "egui widgets for heartsim: ECG strip, 3-D viewport, parameter panels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
heartsim-core.workspace = true
heartsim-geometry.workspace = true
heartsim-sim.workspace = true
heartsim-ecg.workspace = true
heartsim-render.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
glam.workspace = true
image.workspace = true
ron.workspace = true
fluent.workspace = true
unic-langid.workspace = true
sys-locale.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Without `js` the locale lookup returns nothing in a browser and the UI would always be English.
sys-locale = { workspace = true, features = ["js"] }

[dev-dependencies]
egui_kittest.workspace = true
# egui's bundled fonts, so headless kittest harnesses can lay out text
egui = { workspace = true, features = ["default_fonts"] }

[lints]
workspace = true
