[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/inalto/heartsim"
authors = ["heartsim contributors"]
keywords = ["ecg", "cardiac", "electrophysiology", "simulation", "medical-education"]
categories = ["science", "simulation", "visualization"]

[workspace.dependencies]
# --- internal crates (versions must equal [workspace.package].version; checked by `cargo xtask release-check`) ---
heartsim-core = { path = "crates/heartsim-core", version = "0.5.0" }
heartsim-geometry = { path = "crates/heartsim-geometry", version = "0.5.0" }
heartsim-sim = { path = "crates/heartsim-sim", version = "0.5.0", default-features = false }
heartsim-ecg = { path = "crates/heartsim-ecg", version = "0.5.0", default-features = false }
heartsim-render = { path = "crates/heartsim-render", version = "0.5.0", default-features = false }
heartsim-ui = { path = "crates/heartsim-ui", version = "0.5.0" }
heartsim-io = { path = "crates/heartsim-io", version = "0.5.0" }
heartsim-app = { path = "crates/heartsim-app", version = "0.5.0", default-features = false }

# --- GPU / windowing / GUI (versions verified on crates.io 2026-10-31) ---------
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "gles", "webgpu", "webgl"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "persistence", "x11", "wayland", "accesskit"] }
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image", "svg"] }
egui_plot = "0.38.0"
egui_tiles = "0.18.0"
egui-notify = "0.24.0"
# Markdown for tutorial pages; no image loading or regex (pages are text only)
egui_commonmark = { version = "0.26.0", default-features = false, features = ["pulldown_cmark"] }
rfd = "0.17.2"

# --- math / geometry / simulation ---------------------------------------------
glam = { version = "0.34.1", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
encase = { version = "0.13.0", features = ["glam"] }
nalgebra = "0.35.0"
parry3d = "0.31.1"
kiddo = "6.3.0"
rayon = "1.12.0"
wide = "1.7.1"
sprs = "0.11.6"
gltf = { version = "1.4.1", features = ["names", "utils"] }
crc32fast = "1.5.3"

# --- audio -------------------------------------------------------------------
kira = { version = "0.12.6", default-features = false, features = ["cpal"] }

# --- web (heartsim-web, wasm32 only) --------------------------------------------
# wasm-bindgen is pinned exactly: the `wasm-bindgen` CLI that trunk runs must be the same version as this
# crate, and trunk downloads the CLI that matches Cargo.lock.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
js-sys = "0.3.107"
console_error_panic_hook = "0.1.7"
log = "0.4.35"

# --- data / io ---------------------------------------------------------------
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ron = "0.12.3"
toml = "1.1.8"
csv = "1.4.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# PDF without the HTML layout engine (and its system-font lookup): only builtin fonts are used.
printpdf = { version = "0.12.8", default-features = false }
# Share bundles: deflate only (flate2's pure-Rust backend), no encryption or exotic codecs.
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }
directories = "6.0.0"
# Validation bridge (B23): VTU XML, its base64 + zlib payloads, report plots (in-memory bitmaps, embedded font, no system fonts).
roxmltree = "0.21.2"
base64 = "0.22.1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "ab_glyph", "line_series", "point_series"] }
epaint_default_fonts = "0.37.0"

# --- build tooling (xtask only) ----------------------------------------------
# Text, system fonts and raster images are off: the icon is pure vector paths.
resvg = { version = "0.49.0", default-features = false }

# --- app plumbing ------------------------------------------------------------
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
clap = { version = "4.6.7", features = ["derive"] }
pollster = "1.0.1"
# Localisation: Project Fluent (fluent 0.17 pairs with fluent-bundle 0.16 and unic-langid 0.9)
fluent = "0.17.0"
unic-langid = "0.9.6"
sys-locale = "0.3.2"

# --- dev / test --------------------------------------------------------------
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["csv", "json", "ron"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
approx = "0.5.1"
egui_kittest = "0.37.0"
lopdf = { version = "0.44.0", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
many_single_char_names = "allow"
doc_markdown = "allow"

[profile.dev]
opt-level = 1            # simulation code is unusable at opt-level 0

[profile.dev.package."*"]
opt-level = 3            # dependencies (wgpu, egui, image decoders) always optimised

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[profile.bench]
inherits = "release"
debug = true
