[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin", "wasm32-unknown-unknown"]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "MIT-0",
    "Unicode-3.0", "Unlicense", "CC0-1.0", "MPL-2.0", "OFL-1.1", "BSL-1.0", "Ubuntu-font-1.0",
    # webpki-roots (Mozilla's CA root store, used by ureq/rustls for the update check): a permissive data licence that
    # only asks that the data's licence text travels with it; the licence report (`cargo xtask release-check`) includes it.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
